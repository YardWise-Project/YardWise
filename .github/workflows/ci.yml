
name: YardWise CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Run lint
        run: npm run lint --if-present

      - name: Test backend API
        run: |
          npm run dev &
          npx wait-on --timeout 30000 http-get://127.0.0.1:8000/api/health
          npx vitest run

      - name: Build backend
        run: npm run build --if-present

  frontend:
    name: Frontend CI
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npx tsc -b

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Build frontend
        run: npm run build
