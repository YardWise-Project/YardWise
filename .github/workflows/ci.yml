
name: YardWise CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run lint
        run: npm run lint --if-present

      - name: Run tests if configured
        shell: bash
        run: |
          if node -e "const t=require('./package.json').scripts?.test; process.exit(t && !t.includes('no test specified') ? 0 : 1)"; then
            CI=true npm test
          else
            echo "Tests not configured yet."
          fi

      - name: Build backend
        run: npm run build --if-present

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check frontend
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
            npm run lint --if-present
            npm run build
          elif [ -f package.json ]; then
            echo "Missing frontend package-lock.json"
            exit 1
          else
            echo "Frontend not configured yet."
          fi

  docker:
    name: Docker Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet
